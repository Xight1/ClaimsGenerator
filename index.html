<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claim Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/topbar.css" />
</head>
<body>
  <div class="topbar-shell">
    <header class="top-taskbar">
      <button type="button" class="topbar-brand" onclick="setClaimTypeFromShortcut('gas')" aria-label="Claims Generator home">
        <span class="brand-mark">CG</span>
      </button>
      <nav class="topbar-nav" aria-label="Primary navigation">
        <button type="button" class="active" onclick="setClaimTypeFromShortcut('gas')">Gas Claim</button>
        <button type="button" onclick="setClaimTypeFromShortcut('streetlight')">Streetlight</button>
        <button type="button" onclick="setClaimTypeFromShortcut('escalation')">Escalation</button>
        <button type="button" onclick="setClaimTypeFromShortcut('payment')">Payment Information</button>
        <button type="button" onclick="setClaimTypeFromShortcut('followup')">Follow Up</button>
        <button type="button" onclick="setClaimTypeFromShortcut('demand')">Demand Request</button>
        <button type="button" onclick="setClaimTypeFromShortcut('insurance')">Insurance Adjuster</button>
        <button type="button" onclick="setClaimTypeFromShortcut('settlement')">Settlement</button>
      </nav>
    </header>
  </div>

  <div class="shell topbar-layout">
    <div class="container">
      <header class="app-header app-header-centered">
        <div class="header-title-block">
          <h1>Claims Generator</h1>
          <span class="app-version" id="appVersion">v2026-07-28 - Beta</span>
        </div>
        <div class="template-cue header-template-cue" id="selectedTemplateIndicator">
          <span>Selected Template</span>
          <strong>Gas Claim</strong>
        </div>
      </header>

      <main class="workspace" id="claimWorkspace">
        <section class="form-panel">
          <select id="claimType" class="hidden-control" onchange="handleClaimTypeChange()" aria-hidden="true" tabindex="-1">
            <option value="gas">Gas Claim</option>
            <option value="streetlight">Streetlight Claim</option>
            <option value="escalation">Escalation of Claim</option>
            <option value="payment">Payment Information</option>
            <option value="followup">Follow Up</option>
            <option value="demand">Demand Request</option>
            <option value="insurance">Insurance Adjuster</option>
            <option value="settlement">Settlement Calculator</option>
          </select>

          <div class="section" id="senderSection">
            <label for="senderName">Your Name <span style="color:var(--red)">*</span></label>
            <input type="text" id="senderName" placeholder="e.g. Kevin" />
            <div class="error-msg" id="err-senderName">Required</div>
          </div>

          <hr class="divider" />
          <form id="formContainer" novalidate></form>
          <div id="validationBanner"></div>

          <div id="formProgress" class="form-progress">
            <div class="form-progress-header">
              <span id="formProgressText">0 of 0 required fields complete</span>
            </div>
            <div class="form-progress-track">
              <div id="formProgressBar" class="form-progress-bar"></div>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn-primary" onclick="generateEmail()">Generate Email</button>
            <button type="button" class="btn-danger" onclick="resetForm()">Reset</button>
          </div>
        </section>

        <section class="preview-panel">
          <div class="preview-sticky" id="outputSection">
            <div class="preview-label">Subject</div>
            <div id="subjectOutput" class="subject-box"><span class="empty-preview">Complete the fields to preview a subject.</span></div>

            <div class="preview-label">Generated Email</div>
            <div id="emailOutput"><span class="empty-preview">Complete the fields to preview the email body.</span></div>
            <div class="btn-row preview-actions">
              <button type="button" class="btn-primary" onclick="copySubject()">Copy Subject</button>
              <button type="button" class="btn-primary" onclick="copyEmail()">Copy Body</button>
              <span class="copy-feedback" id="copyFeedback">Copied!</span>
            </div>

          </div>
        </section>
      </main>

      <div id="settlementMount"></div>
    </div>
  </div>

  <button type="button" id="floatingThemeToggle" class="floating-theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode" title="Toggle dark mode"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/performance.js" defer></script>
  <script src="assets/js/navigation.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
</body>
</html>
